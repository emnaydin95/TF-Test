workflows:
  ios-testflight:
    name: iOS TestFlight Check
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.astrony.test"
    scripts:
      - name: Set up keychain and signing files
        script: |
          keychain initialize
          # Taze bir private key uret ki Codemagic dagitim sertifikasini olusturabilsin
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
      - name: Flutter packages
        script: flutter pub get
      - name: Pod install (if a Podfile exists)
        script: |
          find . -name "Podfile" -execdir pod install \; || true
      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s) / 60)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
